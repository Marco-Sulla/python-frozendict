name: Build primary wheels

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
    paths:
      - '**'
  workflow_dispatch:

jobs:
  build_wheels:
    name: >
      Build wheels for py ${{ matrix.py }}, os ${{ matrix.cbw_os }}, 
      arch ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        py: [310, 39, 38]
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cbw_os: manylinux_
            arch: x86_64
          - os: windows-latest
            cbw_os: win_
            arch: amd64

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        uses: astral-sh/setup-uv@v7

      - name: Generate random seed
        id: seed
        shell: bash
        run: |
          seed=$(( (RANDOM * 32768 + RANDOM) % 1000000 + 1 ))
          echo "Seed: $seed"
          echo "value=$seed" >> "$GITHUB_OUTPUT"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BUILD: >
            cp${{ matrix.py }}-${{ matrix.cbw_os }}${{ matrix.arch }}
          CIBW_ARCHS: native
          CIBW_BUILD_FRONTEND: build[uv]
          CIBW_CONTAINER_ENGINE: podman
          CIBW_TEST_ENVIRONMENT: PYTHONHASHSEED=${{ steps.seed.outputs.value }}
          CIBW_TEST_REQUIRES: pytest pytest-random-order typing_extensions mypy
          CIBW_TEST_COMMAND: > 
            python -X faulthandler {package}/test/debug.py
            --seed ${{ steps.seed.outputs.value }}
            && python -X faulthandler -m pytest -p no:faulthandler 
            -s {package} --random-order-seed=${{ steps.seed.outputs.value }}
            && python {package}/test/run_type_checker.py

      - uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          archive: false
          if-no-files-found: error

  build_pure_py:
    name: Build and test pure py wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build module
        run: FROZENDICT_PURE_PY=1 pipx run build

      - name: Install dependencies
        run: >
          pip install -U pip pytest pytest-cov pytest-random-order
          typing_extensions mypy

      - name: Generate random seed
        id: seed
        shell: bash
        run: |
          seed=$(( (RANDOM * 32768 + RANDOM) % 1000000 + 1 ))
          echo "Seed: $seed"
          echo "value=$seed" >> "$GITHUB_OUTPUT"

      - name: Install module
        run: pip install dist/*
      
      - name: Run tests
        env:
          PYTHONHASHSEED: ${{ steps.seed.outputs.value }}
        run: >
          pytest --cov=frozendict --cov-report=term-missing --cov-branch 
          --cov-fail-under=100
          --random-order-seed=${{ steps.seed.outputs.value }}
          && python test/run_type_checker.py

      - uses: actions/upload-artifact@v7
        with:
          path: ./dist/*
          archive: false
          if-no-files-found: error

  merge_artifacts:
    needs: [build_wheels, build_pure_py]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v7
        with:
          name: primary_wheels
          delete-merged: true
          compression-level: 0
