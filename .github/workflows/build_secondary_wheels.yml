name: Build secondary wheels

on:
  push:
    tags:
      - v*
  pull_request:
    paths: 
      - '**'
  workflow_dispatch:

jobs:
  build_wheels_qemu:
    name: >
      Build secondary wheels with QEMU for py ${{ matrix.py }}, 
      os ${{ matrix.cbw_os }}, arch ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: [310, 39, 38]
        cbw_os: [manylinux_, musllinux_]
        arch: [ppc64le, s390x, riscv64]

    steps:
      - uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Generate random seed
        id: seed
        shell: bash
        run: |
          seed=$(( (RANDOM * 32768 + RANDOM) % 1000000 + 1 ))
          echo "Seed: $seed"
          echo "value=$seed" >> "$GITHUB_OUTPUT"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BUILD: >
            cp${{ matrix.py }}-${{ matrix.cbw_os }}${{ matrix.arch }}
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD_FRONTEND: >
            ${{
              matrix.cbw_os == 'musllinux_'
              && 'build'
              || 'build[uv]'
            }}
          CIBW_CONTAINER_ENGINE: podman
          CIBW_TEST_ENVIRONMENT: PYTHONHASHSEED=${{ steps.seed.outputs.value }}
          CIBW_TEST_REQUIRES: pytest pytest-random-order
          CIBW_TEST_COMMAND: > 
            python -X faulthandler {package}/test/debug.py
            --seed ${{ steps.seed.outputs.value }}
            && python -X faulthandler -m pytest -p no:faulthandler 
            -s {package} --random-order-seed=${{ steps.seed.outputs.value }}

      - uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          archive: false
          if-no-files-found: error

  build_old_wheels_qemu:
    name: > 
      Build old wheels with QEMU for py ${{ matrix.py }}, 
      os ${{ matrix.cbw_os }}, arch ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: [37, 36]
        cbw_os: [manylinux_, musllinux_]
        arch: [ppc64le, s390x]

    steps:
      - uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Generate random seed
        id: seed
        shell: bash
        run: |
          seed=$(( (RANDOM * 32768 + RANDOM) % 1000000 + 1 ))
          echo "Seed: $seed"
          echo "value=$seed" >> "$GITHUB_OUTPUT"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_BUILD: >
            cp${{ matrix.py }}-${{ matrix.cbw_os }}${{ matrix.arch }}
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD_FRONTEND: build[uv]
          CIBW_CONTAINER_ENGINE: podman
          CIBW_ENVIRONMENT: PYTHONHASHSEED=${{ steps.seed.outputs.value }}
          CIBW_TEST_REQUIRES: pytest pytest-random-order
          CIBW_TEST_COMMAND: > 
            python -X faulthandler {package}/test/debug.py
            --seed ${{ steps.seed.outputs.value }}
            && python -X faulthandler -m pytest -p no:faulthandler 
            -s {package} --random-order-seed=${{ steps.seed.outputs.value }}

      - uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          archive: false
          if-no-files-found: error

  build_wheels:
    name: >
      Build secondary wheels for py ${{ matrix.py }}, 
      os ${{ matrix.cbw_os }}, arch ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        py: [310, 39, 38]
        os: [
          ubuntu-latest,
          ubuntu-24.04-arm,
          windows-latest,
          macos-latest
        ]
        include:
          - os: ubuntu-latest
            cbw_os: musllinux_
            arch: x86_64
          - os: ubuntu-24.04-arm
            cbw_os: manylinux_
            arch: aarch64
          - os: ubuntu-24.04-arm
            cbw_os: musllinux_
            arch: aarch64
          - os: windows-latest
            cbw_os: win_
            arch: arm64
          - os: macos-latest
            cbw_os: macosx_
            arch: x86_64
          - os: macos-latest
            cbw_os: macosx_
            arch: arm64
          - os: macos-latest
            cbw_os: macosx_
            arch: universal2
          - os: ubuntu-latest
            cbw_os: manylinux_
            arch: i686
          - os: ubuntu-latest
            cbw_os: musllinux_
            arch: i686
          - os: ubuntu-24.04-arm
            cbw_os: manylinux_
            arch: armv7l
          - os: ubuntu-24.04-arm
            cbw_os: musllinux_
            arch: armv7l
          - os: windows-latest
            cbw_os: win32
            arch: ""

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        uses: astral-sh/setup-uv@v7

      - name: Generate random seed
        id: seed
        shell: bash
        run: |
          seed=$(( (RANDOM * 32768 + RANDOM) % 1000000 + 1 ))
          echo "Seed: $seed"
          echo "value=$seed" >> "$GITHUB_OUTPUT"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BUILD: >
            cp${{ matrix.py }}-${{ matrix.cbw_os }}${{ matrix.arch }}
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD_FRONTEND: build[uv]
          CIBW_CONTAINER_ENGINE: podman
          CIBW_TEST_ENVIRONMENT: PYTHONHASHSEED=${{ steps.seed.outputs.value }}
          CIBW_TEST_REQUIRES: pytest pytest-random-order
          CIBW_TEST_COMMAND: > 
            python -X faulthandler {package}/test/debug.py
            --seed ${{ steps.seed.outputs.value }}
            && python -X faulthandler -m pytest -p no:faulthandler 
            -s {package} --random-order-seed=${{ steps.seed.outputs.value }}

      - uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          archive: false
          if-no-files-found: error

  build_old_wheels:
    name: >
      Build old wheels for py ${{ matrix.py }}, 
      os ${{ matrix.cbw_os }}, arch ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        py: [37, 36]
        os: [
          ubuntu-latest,
          ubuntu-24.04-arm,
          windows-latest,
          macos-latest
        ]
        include:
          - os: ubuntu-latest
            cbw_os: manylinux_
            arch: x86_64
          - os: ubuntu-latest
            cbw_os: musllinux_
            arch: x86_64
          - os: ubuntu-24.04-arm
            cbw_os: manylinux_
            arch: aarch64
          - os: ubuntu-24.04-arm
            cbw_os: musllinux_
            arch: aarch64
          - os: windows-latest
            cbw_os: win_
            arch: amd64
          - os: macos-latest
            cbw_os: macosx_
            arch: x86_64
          - os: ubuntu-latest
            cbw_os: manylinux_
            arch: i686
          - os: ubuntu-latest
            cbw_os: musllinux_
            arch: i686
          - os: ubuntu-24.04-arm
            cbw_os: manylinux_
            arch: armv7l
          - os: ubuntu-24.04-arm
            cbw_os: musllinux_
            arch: armv7l
          - os: windows-latest
            cbw_os: win32
            arch: ""

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        uses: astral-sh/setup-uv@v7

      - name: Generate random seed
        id: seed
        shell: bash
        run: |
          seed=$(( (RANDOM * 32768 + RANDOM) % 1000000 + 1 ))
          echo "Seed: $seed"
          echo "value=$seed" >> "$GITHUB_OUTPUT"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_BUILD: >
            cp${{ matrix.py }}-${{ matrix.cbw_os }}${{ matrix.arch }}
          CIBW_ARCHS: ${{ matrix.arch == '' && 'x86' || matrix.arch }}
          CIBW_BUILD_FRONTEND: build[uv]
          CIBW_CONTAINER_ENGINE: podman
          CIBW_ENVIRONMENT: PYTHONHASHSEED=${{ steps.seed.outputs.value }}
          CIBW_TEST_REQUIRES: pytest pytest-random-order
          CIBW_TEST_COMMAND: > 
            python -X faulthandler {package}/test/debug.py
            --seed ${{ steps.seed.outputs.value }}
            && python -X faulthandler -m pytest -p no:faulthandler 
            -s {package} --random-order-seed=${{ steps.seed.outputs.value }}

      - uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          archive: false
          if-no-files-found: error

  merge_artifacts:
    needs: [build_wheels_qemu, build_old_wheels_qemu, build_wheels, build_old_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v7
        with:
          name: secondary_wheels
          delete-merged: true
          compression-level: 0
