name: Publish on PyPI

# It takes the wheels and the sdist of the last green runs of the two build pipelines on the chosen
# tag.
on: workflow_dispatch

jobs:
  publish:
    name: Publish ${{ github.ref_name }} on PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/frozendict
    permissions:
      # trusted publishing and the attestations
      id-token: write
      actions: read

    steps:
      - name: Check the tag
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Run it from a version tag, not from '$GITHUB_REF'"
            exit 1
          fi

      - name: Find the build runs of the tag
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for workflow in build_primary_wheels build_secondary_wheels; do
            id=$(gh run list --workflow "$workflow.yml" --branch "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" --event push --status success --limit 1 --json databaseId \
            --jq '.[0].databaseId // empty')

            if [[ -z "$id" ]]; then
              echo "No green run of $workflow.yml for $GITHUB_REF_NAME"
              exit 1
            fi

            echo "$workflow: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$id"
            echo "$workflow=$id" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/download-artifact@v8
        with:
          name: primary_wheels
          path: downloads/primary
          github-token: ${{ github.token }}
          run-id: ${{ steps.runs.outputs.build_primary_wheels }}

      - uses: actions/download-artifact@v8
        with:
          name: secondary_wheels
          path: downloads/secondary
          github-token: ${{ github.token }}
          run-id: ${{ steps.runs.outputs.build_secondary_wheels }}

      - name: Collect the distributions
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir dist
          find downloads -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec mv -t dist {} +
          ls -l dist
          c_wheels=0

          for f in dist/*; do
            case "${f#dist/}" in
              frozendict-"$version".tar.gz | frozendict-"$version"-py3-none-any.whl) ;;
              frozendict-"$version"-cp*.whl) c_wheels=$((c_wheels + 1)) ;;
              *) echo "Not a $version distribution: $f"; exit 1 ;;
            esac
          done

          test -f "dist/frozendict-$version.tar.gz"
          test -f "dist/frozendict-$version-py3-none-any.whl"
          test "$c_wheels" -gt 0

      - uses: pypa/gh-action-pypi-publish@release/v1
